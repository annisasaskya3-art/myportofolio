{# Modal tambah Experience. Hanya dirender untuk peran yang berhak (superuser / Editor). #}
<dialog id="experience-modal" class="exp-modal" aria-labelledby="experience-modal-title">
    <div class="exp-modal__content">
        <button type="button" class="exp-modal__close" data-close-modal aria-label="Tutup form">×</button>
        <h2 id="experience-modal-title">Tambah Experience</h2>

        <form id="experience-form" method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <p class="form-error" data-error-for="{{ field.name }}"></p>
                </div>
            {% endfor %}
            <div class="exp-modal__actions">
                <button type="button" class="button button-secondary" data-close-modal>Batal</button>
                <button type="submit" class="button">Simpan</button>
            </div>
        </form>
    </div>
</dialog>
